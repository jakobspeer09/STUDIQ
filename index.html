:root{--bg:#EEF2F8;--card:#fff;--ink:#13203A;--mute:#5B6780;--line:#D5DCE8;--blue:#1F57C3;--blueBg:#E4EDFB;--red:#B8322A;--redBg:#FBE6E4;--green:#17794F;--greenBg:#DDF3E8;--amber:#9A6A12;--amberBg:#FBF0DA;--z:1;--sh:0 10px 34px rgba(20,35,70,.10),0 2px 6px rgba(20,35,70,.06);--onblue:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1626;--card:#17223A;--ink:#E8EDF7;--mute:#9AA7C0;--line:#2A3858;--blue:#7FA8FF;--blueBg:#1B2E55;--red:#FF8F86;--redBg:#3E1D22;--green:#6FDDA8;--greenBg:#153A2C;--amber:#F5C26B;--amberBg:#3B2F14;--sh:0 10px 34px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);--onblue:#0E1626;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1626;--card:#17223A;--ink:#E8EDF7;--mute:#9AA7C0;--line:#2A3858;--blue:#7FA8FF;--blueBg:#1B2E55;--red:#FF8F86;--redBg:#3E1D22;--green:#6FDDA8;--greenBg:#153A2C;--amber:#F5C26B;--amberBg:#3B2F14;--sh:0 10px 34px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);--onblue:#0E1626;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--z));height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 420px at 90% -5%,color-mix(in srgb,#C9962B 18%,transparent),transparent),radial-gradient(900px 520px at 6% -8%,color-mix(in srgb,var(--blue) 24%,transparent),transparent),var(--bg);transform:translateZ(0)}
#app{max-width:520px;margin:0 auto;padding:1rem 1rem 7rem}
[data-layout=tablet] #app{max-width:980px;padding:1.5rem 2rem 7.5rem}
h1{font-size:1.7rem;line-height:1.15;margin:.2rem 0 .3rem;font-weight:800}
h2{font-size:1.15rem;margin:1.4rem 0 .6rem;font-weight:800}
p{margin:.3rem 0}.mute{color:var(--mute);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid color-mix(in srgb,#fff 45%,var(--line));border-radius:20px;padding:1rem;margin:.7rem 0;box-shadow:var(--sh)}
.box{border-radius:12px;padding:.75rem .9rem;margin:.8rem 0;border-left:5px solid}

["Minderjährige","Eine 16-Jährige bekommt ein Buch geschenkt. Brauchen die Eltern zuzustimmen?",["Ja, immer vorher","Ja, nachträglich","Nein, lediglich rechtlicher Vorteil (§ 107)","Nein, wegen § 110"],2,"Es entstehen keine Pflichten, also kein rechtlicher Nachteil. Entscheidend ist der rechtliche, nicht der finanzielle Vorteil."],

["Minderjährige","Die Eltern stimmen dem Kauf erst NACH Vertragsschluss zu. Das ist eine …",["Einwilligung (§ 183)","Genehmigung (§ 184)","Ermächtigung (§ 112)","Anfechtung (§ 143)"],1,"Einwilligung = vorher (§ 183), Genehmigung = nachträglich (§ 184)."],

["Minderjährige","Wofür ist die Genehmigung des Familiengerichts nötig (§ 112)?",["Nebenjob","Taschengeldkauf","Selbstständiges Erwerbsgeschäft","Geschenk annehmen"],2,"§ 112: Ermächtigung zum Erwerbsgeschäft braucht die Genehmigung des Familiengerichts."],
["Minderjährige","Was erlaubt die Ermächtigung nach § 113 (Arbeitsverhältnis)?",["Jeden beliebigen Vertrag","Nur Geschäfte im Rahmen dieses Dienst-/Arbeitsverhältnisses","Grundstückskäufe","Alle Ratenkäufe"],1,"§ 113 gilt nur für dieses Arbeitsverhältnis, nicht für beliebige Verträge."],
["Minderjährige","Was stimmt über einen schwebend unwirksamen Vertrag?",["Er kann nicht mehr genehmigt werden","Er kann noch genehmigt werden","Er ist von Anfang an nichtig","Er ist sofort wirksam"],1,"Schwebend unwirksam: Die Wirksamkeit hängt noch von der Genehmigung ab. Nichtig dagegen heißt von Anfang an unwirksam."],

   wird neu geladen, erneut zusammengeführt und wiederholt. So kann kein Gerät ein anderes überschreiben. */
async function syncCore(){
 const t=await tok();if(!t)return;
 try{await loadGlobals();ui.gerr=""}catch(e){ui.gerr=gerr(e)}
 for(let n=0;n<4;n++){
  const j=await sbj("/rest/v1/user_state?select=data,nick,updated_at&user_id=eq."+au.id,{headers:H(t)}),r=j&&j[0];
  if(r&&r.data)st=merge(st,r.data);
  if(r&&r.nick&&!st.set.nick)st.set.nick=r.nick;
  persist();track();
  if(r&&!dirty)return;
  const was=dirty;dirty=false;
  const body={nick:st.set.nick||"",data:{...st,run:null,view:"home",guest:false},updated_at:new Date().toISOString()};
  try{
   if(r){const res=await sbj("/rest/v1/user_state?user_id=eq."+au.id+"&updated_at=eq."+encodeURIComponent(r.updated_at),{method:"PATCH",headers:{...H(t),Prefer:"return=representation"},body:JSON.stringify(body)});if(res&&res.length)return;dirty=true;continue}
   await sbj("/rest/v1/user_state",{method:"POST",headers:{...H(t),Prefer:"return=minimal"},body:JSON.stringify({user_id:au.id,...body})});return
  }catch(e){dirty=true;if(!r&&e.st===409)continue;throw e}
 }
 throw new Error("Konflikt")}

const IL=s=>E(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function mdLite(s){const out=[],L=String(s).split(/\r?\n/);let i=0;const special=/^(#{1,3}\s|\||[-*]\s|\d+[.)]\s|>\s|!\s)/;
 while(i<L.length){const l=L[i].trim();if(!l){i++;continue}let m;
  if((m=l.match(/^(#{1,3})\s+(.*)$/))){out.push({h:m[2],l:m[1].length===3?3:2});i++;continue}
  if(l[0]==="|"){const rows=[];while(i<L.length&&L[i].trim()[0]==="|"){rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));i++}
   const sp=rows.length>1&&rows[1].every(c=>/^:?-{2,}:?$/.test(c));out.push({table:{head:sp?rows[0]:[],rows:sp?rows.slice(2):rows}});continue}
  if(/^[-*]\s+/.test(l)){const a=[];while(i<L.length&&/^[-*]\s+/.test(L[i].trim())){a.push(L[i].trim().replace(/^[-*]\s+/,""));i++}out.push({ul:a});continue}
  if(/^\d+[.)]\s+/.test(l)){const a=[];while(i<L.length&&/^\d+[.)]\s+/.test(L[i].trim())){a.push(L[i].trim().replace(/^\d+[.)]\s+/,""));i++}out.push({ol:a});continue}
  if(l.startsWith("> ")){out.push({merk:l.slice(2)});i++;continue}
  if(l.startsWith("! ")){out.push({falle:l.slice(2)});i++;continue}
  const p=[l];i++;while(i<L.length&&L[i].trim()&&!special.test(L[i].trim())){p.push(L[i].trim());i++}out.push({p:p.join(" ")})}
 return out}

 if(b.table&&Array.isArray(b.table.rows)){const hd=Array.isArray(b.table.head)?b.table.head:[];const cols=Math.max(hd.length,...b.table.rows.map(r=>Array.isArray(r)?r.length:1));const nc=[];for(let ci=0;ci<cols;ci++)nc[ci]=ci>0&&b.table.rows.length>0&&b.table.rows.every(r=>Array.isArray(r)&&/^\d+$/.test(String(r[ci]??"")));return(b.cap?`<div class="tcap">${IL(b.cap)}</div>`:"")+`<div class="tw"><table class="${cols>=4?"w4":""}">${hd.some(Boolean)?`<thead><tr>${hd.map((c,ci)=>`<th${nc[ci]?' class="n"':""}>${IL(c)}</th>`).join("")}</tr></thead>`:""}<tbody>${b.table.rows.map(r=>`<tr>${(Array.isArray(r)?r:[r]).map((c,ci)=>`<td${nc[ci]?' class="n"':""}>${IL(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}

 return`<div id="rp"></div>${head}<p class="mute">Zusammenfassungen, Tabellen und Stoffübersichten zu ${E(st.set.fach)}.</p><div class="toc">${toc.map(([id,t])=>`<button class="chip" data-a="jump" data-v="${id}">${E(t)}</button>`).join("")}</div><article class="paper">${html}</article>`}
addEventListener("scroll",()=>{if(st.view!=="info")return;requestAnimationFrame(()=>{const el=$("#rp");if(!el)return;const h=document.documentElement.scrollHeight-innerHeight;el.style.width=(h>0?Math.min(100,scrollY/h*100):0)+"%"})},{passive:true});

/* ===== Optionen ===== */
function vSet(){const s=st.set,det=(k,t,body)=>`<details class="card grp" data-k="${k}" ${ui.det[k]?"open":""}><summary>${t}</summary>${body}</details>`,
 tg=(k,l,d)=>`<div class="sr"><span><b>${l}</b>${d?`<small>${d}</small>`:""}</span><button type="button" role="switch" aria-checked="${!!s[k]}" aria-label="${l}" class="tgl ${s[k]?"on":""}" data-a="tgl" data-v="${k}"></button></div>`,
 sg=(l,k,arr,d)=>`<div class="sr"><span><b>${l}</b>${d?`<small>${d}</small>`:""}</span>${seg(arr,v=>String(s[k])===v,"set:"+k)}</div>`,
 AC=[["blue","#1F57C3","Blau"],["green","#17794F","Grün"],["violet","#6D3FD1","Violett"],["orange","#D9670B","Orange"],["rose","#C2275F","Rosé"]];
 return`<div class="sethead"><h1 style="margin:0">Einstellungen</h1>${au?`<button class="btn sm pri" data-a="syncnow">Synchronisieren</button>`:sbOn()?`<button class="btn sm pri" data-a="tologin">Anmelden</button>`:""}</div>
 <p class="mute" style="margin:.4rem 0 .2rem">${au?E(au.e)+" · "+syncPill():"Ohne Konto: Dein Stand bleibt nur auf diesem Gerät."}</p>
 <div class="card grp"><h3>Profil</h3><div class="sr col"><b style="font-weight:600;font-size:.95rem">Nickname</b><div class="in"><input id="nick" placeholder="Dein Nickname" maxlength="20" value="${E(s.nick||"")}" style="margin:0"></div></div></div>
 <div class="card grp"><h3>Darstellung</h3>
  ${sg("Design","theme",[["auto","System"],["light","Hell"],["dark","Dunkel"]])}
  <div class="sr"><span><b>Akzentfarbe</b></span><div class="dots">${AC.map(([k,c,n])=>`<button class="${s.accent===k?"on":""}" style="--c:${c}" data-a="set:accent" data-v="${k}" aria-label="${n}"></button>`).join("")}</div></div>
  ${sg("Textgröße","size",[["0.9","S"],["1","M"],["1.15","L"],["1.3","XL"]])}
  ${sg("Format","layout",[["auto","Auto"],["phone","Handy"],["tablet","iPad"]])}
  ${tg("anim","Animationen","Weiche Übergänge und Effekte")}
  ${tg("compact","Kompaktansicht","Engere Abstände, mehr Inhalt pro Bildschirm")}
  ${tg("hc","Hoher Kontrast")}</div>
 <div class="card grp"><h3>Lernen</h3>
  ${tg("shuffle","Antworten mischen")}
  ${sg("Standard-Modus","mode",[["training","Training"],["exam","Prüfung"]])}
  ${tg("sound","Ton","Kurzer Klang bei richtig und falsch")}
  ${tg("haptic","Vibration","Rückmeldung am Handy")}
  ${tg("remind","Streak-Erinnerung","Hinweis auf der Startseite, wenn dein Streak heute endet")}</div>
 ${det("exd","Klassenarbeiten-Termine",`<div class="sr col"><div class="row"><select id="xf" style="margin:0">${FACH.map(f=>`<option ${f===s.fach?"selected":""}>${f}</option>`).join("")}</select><input type="date" id="xd" style="margin:0"><input id="xt" placeholder="Titel (optional)" style="margin:0"></div><button class="btn sm" style="margin-top:.6rem" data-a="addexd">Termin hinzufügen</button></div>${(st.exd||[]).map((x,i)=>`<div class="hist"><span>${E(x.f)} · ${E(x.d)}${x.t?" · "+E(x.t):""}</span><button class="chip" data-a="delexd" data-v="${i}">Löschen</button></div>`).join("")}`)}
 ${isAdmin()?admCard():""}
 ${st.custom.length?det("old","Eigene Klausuren (alt)",`<p class="mute">Früher selbst importierte Klausuren. Neue Klassenarbeiten kommen automatisch von der Lehrkraft/dem Admin.</p>${st.custom.map(e=>`<div class="hist"><span>${E(e.title)}<br><small class="mute">${E(e.fach||"")}</small></span><button class="chip" data-a="delx" data-v="${E(e.id)}">Löschen</button></div>`).join("")}`):""}
 ${det("dat","Daten",`<div class="sr col"><b style="font-weight:600;font-size:.95rem">Lernstand sichern</b><textarea id="bak" class="in" placeholder="Hier erscheint die Sicherung. Zum Wiederherstellen hier einfügen."></textarea><div class="row" style="margin-top:.5rem"><button class="btn" data-a="bexp">Sicherung erzeugen</button><button class="btn" data-a="bimp">Wiederherstellen</button></div></div>
  <div class="sr col"><button class="btn ${ui.confirm?"danger":""}" data-a="reset">${ui.confirm?"Wirklich alles löschen? Nochmal tippen":"Lernfortschritt löschen"}</button></div>`)}
 ${ui.msg&&!ui.det.imp?`<div class="box merk"><b>Hinweis</b>${E(ui.msg)}</div>`:""}
 ${legalFoot()}
 <div class="logout">${au?`<button class="btn danger" data-a="logout">${ui.lo?"Änderungen noch nicht gesichert. Trotzdem abmelden?":"Abmelden"}</button>`:sbOn()?`<button class="btn pri" data-a="tologin">Anmelden / Registrieren</button>`:""}</div>`}

/* ===== Anmeldung ===== */
const trErr=m=>/Invalid login/i.test(m)?"E-Mail oder Passwort stimmt nicht.":/already registered/i.test(m)?"Diese E-Mail ist schon registriert. Bitte melde dich an.":/not confirmed/i.test(m)?"Bitte bestätige zuerst deine E-Mail.":/fetch|network/i.test(m)?"Keine Verbindung. Prüfe dein Internet.":/password/i.test(m)?"Das Passwort ist zu schwach (mindestens 6 Zeichen).":m;
function vAuth(){const g=ui.am==="reg";return`<div class="auth"><img class="dino" src="${E(DINO_IMG)}" alt="StudiQ" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'dino fb',textContent:'🦖'}))"><h1>StudiQ</h1><p class="mute">${g?"Erstelle dein Konto und lerne auf jedem Gerät weiter.":"Schön, dass du da bist. Melde dich an."}</p>
<div class="card"><div class="chips"><button class="chip ${g?"":"on"}" data-a="amode" data-v="in">Anmelden</button><button class="chip ${g?"on":""}" data-a="amode" data-v="reg">Registrieren</button></div>
${g?`<input id="an" placeholder="Nickname" maxlength="20" autocomplete="nickname" value="${E(ui.an||"")}">`:""}
<input id="ae" type="email" placeholder="E-Mail" autocomplete="email" value="${E(ui.ae||"")}"><input id="ap" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="${g?"new-password":"current-password"}">
${ui.amsg?`<div class="box falle"><b>Hinweis</b>${E(ui.amsg)}</div>`:""}
<button class="btn pri" data-a="auth" ${ui.busy?"disabled":""}>${ui.busy?"Bitte warten …":g?"Konto erstellen":"Anmelden"}</button></div>
<button class="btn" data-a="guest">Ohne Konto fortfahren</button><p class="mute">Mit der Anmeldung akzeptierst du die <button class="chip" style="min-height:0;padding:.1rem .5rem" data-a="modal" data-v="datenschutz">Datenschutzerklärung</button></p></div>`}
async function doAuth(){const g=ui.am==="reg",e=$("#ae").value.trim(),p=$("#ap").value,n=g?$("#an").value.trim():"";ui.ae=e;ui.an=n;
 if(g&&!n||!e||p.length<6){ui.amsg=g&&!n?"Bitte gib einen Nickname ein.":"Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.";render();return}
 ui.busy=1;ui.amsg="";render();
 try{let j;if(g){j=await sbj("/auth/v1/signup",{method:"POST",headers:H(),body:JSON.stringify({email:e,password:p,data:{nick:n}})});if(!j.access_token){ui.busy=0;ui.am="in";ui.amsg="Fast geschafft: Bestätige deine E-Mail über den Link, den wir dir geschickt haben, und melde dich danach an.";render();return}}
 else j=await sbj("/auth/v1/token?grant_type=password",{method:"POST",headers:H(),body:JSON.stringify({email:e,password:p})});
 setAu(j);
 /* anderes Konto auf diesem Gerät: lokalen Stand des Vorgängers nicht vermischen */
 if(st.uid&&st.uid!==au.id){st=norm({});track()}
 st.uid=au.id;if(n)st.set.nick=n;dirty=true;
 await sync();
 if(!st.set.nick)st.set.nick=(j.user.user_metadata||{}).nick||"";st.guest=false;st.view="home";ui.busy=0;save();render()}
 catch(x){ui.busy=0;ui.amsg=trErr(x.message);render()}}

/* ===== Aktionen ===== */
function act(a,v){const s=st.set;
 if(a==="keep")return;
 if(a==="gpick"){const f=$("#gfile");f&&f.click();return}
 if(a==="gpub"){gpub();return}
 if(a==="gdel"){gdel(v);return}
 if(a==="gedit"){gedit(v);return}
 if(a==="edback"){const d=ui.ed;if(d&&d.dirty&&!d.cb){d.cb=1;render();return}ui.ed=null;st.view="set";render();return}
 if(a==="edsave"){edsave();return}
 if(a==="edtab"){const d=ui.ed;d.tab=v;d.f="";d.lim=30;d.cd=null;render();return}
 if(a==="edmore"){ui.ed.lim+=30;render();return}
 if(a==="edaddt"){const d=ui.ed;d.f="";d.tab="t";d.ex.t.push(["Allgemein","",""]);d.lim=Math.max(d.lim,d.ex.t.length);d.dirty=true;render();return}
 if(a==="edq"){const d=ui.ed;if(d.cd!==v){d.cd=v;render();return}d.cd=null;const[w,i]=v.split(".");(w==="q"?d.ex.q:d.ex.t).splice(+i,1);d.dirty=true;render();return}
 if(a==="jump"){const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:st.set.anim===false?"auto":"smooth",block:"start"});return}
 if(a==="amode"){ui.ae=$("#ae")?$("#ae").value:"";ui.am=v;ui.amsg="";render();return}
 if(a==="auth"){doAuth();return}
 if(a==="guest"){st.guest=true;st.view="home";save();render();return}
 if(a==="tologin"){st.guest=false;st.view="auth";render();return}
 if(a==="syncnow"){sync().then(()=>render());return}
 if(a==="logout"){if(!ui.lo&&dirty&&ui.sync==="err"){ui.lo=1;render();return}
  Promise.race([sync(),new Promise(r=>setTimeout(r,4000))]).finally(()=>{au=null;try{localStorage.removeItem(AK);localStorage.removeItem(KEY);localStorage.removeItem(GK)}catch(e){}location.reload()});return}
 if(a==="close"){ui.modal=""}
 else if(a==="modal"){ui.modal=v}
 else if(a==="go"){st.view=v;ui.confirm=0;ui.lo=0;ui.msg="";ui.qmsg=""}
 else if(a==="exam"){s.exam=v;s.topics=[];vr=null;tr=null}
 else if(a==="topic"){v==="__all"?s.topics=[]:s.topics=s.topics.includes(v)?s.topics.filter(x=>x!==v):[...s.topics,v]}
 else if(a==="mode"){s.mode=v}
 else if(a==="count"){s.count=+v}
 else if(a==="wrongtoggle"){ui.onlyWrong=!ui.onlyWrong}
 else if(a==="start"){start()}
 else if(a==="resume"){const re=st.run&&exams().find(e=>e.id===st.run.ex);if(re){s.fach=re.fach;s.exam=re.id}st.view="quiz"}
 else if(a==="resumeother"){const re=st.run&&exams().find(e=>e.id===st.run.ex);if(re){s.fach=re.fach;s.exam=re.id;s.topics=[]}}
 else if(a==="pick"){const r=st.run,id=r.ids[r.i];if(r.mode==="training"&&r.a[id]!==undefined)return;r.a[id]=+v;
  if(r.mode==="training"){const q=QL(exams().find(e=>e.id===r.ex)||cur()).find(x=>x.id===id);if(q)rec(id,+v===q.a)}}
 else if(a==="chk"){const r=st.run,id=r.ids[r.i],q=QL(exams().find(e=>e.id===r.ex)||cur()).find(x=>x.id===id);if(!q)return;const v2=capAns(q);if(!v2||emptyAns(q,v2)){ui.hint="Bitte zuerst antworten.";render();return}ui.hint="";r.a[id]=v2;rec(id,okq(q,v2))}
 else if(a==="asg"){ui.assign=v}
 else if(a==="aclose"){ui.assign=""}
 else if(a==="asf"){const[id,f]=v.split("|");st.ov[id]={...(st.ov[id]||{}),fach:f,_t:Date.now()};s.fach=f;s.exam=id}
 else if(a==="ask"){const[id,k]=v.split("|");st.ov[id]={...(st.ov[id]||{}),kind:k,_t:Date.now()}}
 else if(a==="next"){const r=st.run,cid=r.ids[r.i],cq=QL(exams().find(e=>e.id===r.ex)||cur()).find(x=>x.id===cid);ui.hint="";
  if(cq&&(cq.ty==="fill"||cq.ty==="match")&&r.mode==="exam"){const v2=capAns(cq);if(v2)r.a[cid]=v2}
  if(r.a[cid]===undefined)return;
  if(r.i+1<r.ids.length)r.i++;else{const ex=exams().find(e=>e.id===r.ex)||cur(),map=Object.fromEntries(QL(ex).map(x=>[x.id,x]));
   if(r.mode==="exam")r.ids.forEach(i=>map[i]&&rec(i,okq(map[i],r.a[i])));
   r.done=true;st.hist.unshift({d:Date.now(),ex:r.ex,m:r.mode,n:r.ids.length,s:r.ids.filter(i=>map[i]&&okq(map[i],r.a[i])).length});st.hist=st.hist.slice(0,30)}}
 else if(a==="quit"||a==="again"){st.run=null;ui.onlyWrong=false}
 else if(a==="tt"){ui.tt=v}
 else if(a==="tf"){ui.tf=v}
 else if(a==="tt2"){ui.open[v]=!ui.open[v]}
 else if(a==="tmode"){ui.tmode=v;ui.qmsg=""}
 else if(a==="mark"){const[id,k]=v.split("|");st.tm[id]=st.tm[id]===k?"":k;st.tmt[id]=Date.now()}
 else if(a==="open"){const[w,id]=v.split("|"),e=exams().find(x=>x.id===id);if(e){s.fach=e.fach;s.exam=id;s.topics=[]}vr=null;tr=null;st.view=w}
 else if(a==="dir"){s.dir=v}
 else if(a==="tdir"){s.tdir=v}
 else if(a==="vstart"||a==="tstart"){startT(a[0])}
 else if(a==="vcheck"||a==="tcheck"){checkT(a[0])}
 else if(a==="vnext"||a==="tnext"){nextT(a[0])}
 else if(a==="tforce"){forceT()}
 else if(a==="vquit"){vr=null}
 else if(a==="tquit"){tr=null}
 else if(a==="addexd"){const d=$("#xd").value;if(!d){ui.msg="Bitte ein Datum wählen.";ui.det.exd=true;render();return}st.exd=[...(st.exd||[]),{f:$("#xf").value,d,t:$("#xt").value.trim().slice(0,40),mt:Date.now()}];ui.msg="Termin gespeichert."}
 else if(a==="delexd"){const x=st.exd[+v];if(x){st.del[exk(x)]=Date.now();st.exd.splice(+v,1)}}
 else if(a.startsWith("set:")){const k=a.slice(4);s[k]=BOOLS.includes(k)?v==="true":k==="size"?+v:v}
 else if(a==="tgl"){s[v]=!s[v]}
 else if(a==="tpl"){$("#imp").value=JSON.stringify({id:"klausur-2",title:"BWL · Neues Thema",fach:"VBL",kind:"test",q:[["Thema","Multiple Choice: Frage?",["A","B","C","D"],0,"Erklärung"],["Thema","Richtig/Falsch: Aussage.",true,"Erklärung"],["Thema","Lückentext: Der Kaufvertrag ist ein ___ .",[],"Verpflichtungsgeschäft","Erklärung","fill"],["Thema","Ordne zu:",[["§ 1","Rechtsfähigkeit"],["§ 183","Einwilligung"]],null,"Erklärung","match"]],t:[["Thema","Begriff","Definition"]],doc:"## Überblick\nText mit **fett**.\n\n| Begriff | Bedeutung |\n|---|---|\n| A | Erklärung A |\n\n- Stichpunkt\n> Merksatz\n! Typischer Fehler"},null,1);return}
 else if(a==="import"){imp($("#imp").value);return}
 else if(a==="delx"){st.custom=st.custom.filter(e=>e.id!==v);delete st.ov[v];st.del["x:"+v]=Date.now();if(s.exam===v)s.exam=""}
 else if(a==="bexp"){$("#bak").value=JSON.stringify(st);return}
 else if(a==="bimp"){try{const o=JSON.parse($("#bak").value);if(!o||typeof o!=="object"||!o.set)throw 0;st=merge(st,o)}catch(e){ui.msg="Sicherung nicht lesbar.";ui.det.dat=true;render();return}ui.msg="Sicherung eingespielt und mit dem aktuellen Stand zusammengeführt."}
 else if(a==="reset"){if(!ui.confirm){ui.confirm=1;render();return}st.qs={};st.tm={};st.tmt={};st.hist=[];st.run=null;st.rst=Date.now();ui.confirm=0;ui.msg="Fortschritt gelöscht."}
 save();render()}
function imp(txt){try{let o=JSON.parse(txt);o=Array.isArray(o)?o:[o];
 for(const x of o){if(!x||!x.id||!x.title||(!Array.isArray(x.q)&&!Array.isArray(x.t)&&!x.doc))throw 0;
  if(EXAMS.some(e=>e.id===x.id))throw 1;
  x.id=String(x.id);x.q=(x.q||[]).filter(r=>nq(r));x.t=(x.t||[]).filter(r=>Array.isArray(r)&&r.length>=3);
  x.fach=FACH.includes(x.fach)?x.fach:(st.set.fach||"VBL");x.kind=KINDS.some(k=>k[0]===x.kind)?x.kind:"test";x.mt=Date.now();
  delete st.ov[x.id];delete st.del["x:"+x.id];ui.assign=x.id;st.custom=st.custom.filter(e=>e.id!==x.id);st.custom.push(x);st.set.exam=x.id;st.set.topics=[];st.set.fach=x.fach}
 ui.det.imp=true;ui.msg="Importiert (Fach/Rubrik über ⋯ änderbar): "+o.map(x=>x.title).join(", ")}catch(e){ui.det.imp=true;ui.msg=e===1?"Diese ID gehört zu einer eingebauten Klausur. Bitte andere ID wählen.":"Format nicht gültig. Nutze „Vorlage einfügen“."}
 save();render()}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;if(b.dataset.a==="close"&&e.target.closest(".modal>div")&&!e.target.closest("button"))return;act(b.dataset.a,b.dataset.v)});
document.addEventListener("keydown",e=>{
 const run=st.view==="voc"?vr:st.view==="terms"&&ui.tmode==="quiz"?tr:null,k=st.view==="voc"?"v":"t";
 if(e.key==="Enter"&&!e.shiftKey&&run&&!run.done&&!e.isComposing&&e.target.id!=="ts"){e.preventDefault();act(k+(run.fb?"next":"check"));return}
 if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("term")){e.preventDefault();act("tt2",e.target.dataset.v)}});
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.ed){edIn(e.target);return}if(e.target.id==="edf"&&ui.ed){ui.ed.f=e.target.value;ui.ed.lim=30;const p=e.target.selectionStart;render();const n=$("#edf");n.focus();n.setSelectionRange(p,p);return}if(e.target.id==="nick"){st.set.nick=e.target.value.slice(0,20);save();return}if(e.target.id==="ts"){ui.tq=e.target.value;const p=e.target.selectionStart;render();const n=$("#ts");n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id==="gfile"&&e.target.files[0]){const fl=e.target.files[0],f=new FileReader();f.onload=()=>gparse(f.result,fl.name);f.readAsText(fl);e.target.value="";return}if(e.target.id==="gfach"&&ui.gp){ui.gp.fach=e.target.value;return}if(e.target.id==="file"&&e.target.files[0]){const f=new FileReader();f.onload=()=>imp(f.result);f.readAsText(e.target.files[0])}});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.k)ui.det[d.dataset.k]=d.open},true);

/* ===== Start ===== */
if(!st.set.exam&&exams()[0])st.set.exam=exams()[0].id;
if(au&&sbOn()){ui.boot=1;render();
 const bt=setTimeout(()=>{if(ui.boot){ui.boot=0;render()}},3500);
 sync().then(()=>{clearTimeout(bt);ui.boot=0;render()})}
else render();
</script></body></html>
