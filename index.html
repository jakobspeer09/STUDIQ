<style>
:root{--bg:#EEF2F8;--card:#fff;--ink:#13203A;--mute:#5B6780;--line:#D5DCE8;--blue:#1F57C3;--blueBg:#E4EDFB;--red:#B8322A;--redBg:#FBE6E4;--green:#17794F;--greenBg:#DDF3E8;--amber:#9A6A12;--amberBg:#FBF0DA;--z:1;--sh:0 10px 34px rgba(20,35,70,.10),0 2px 6px rgba(20,35,70,.06);--onblue:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1626;--card:#17223A;--ink:#E8EDF7;--mute:#9AA7C0;--line:#2A3858;--blue:#7FA8FF;--blueBg:#1B2E55;--red:#FF8F86;--redBg:#3E1D22;--green:#6FDDA8;--greenBg:#153A2C;--amber:#F5C26B;--amberBg:#3B2F14;--sh:0 10px 34px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);--onblue:#0E1626;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1626;--card:#17223A;--ink:#E8EDF7;--mute:#9AA7C0;--line:#2A3858;--blue:#7FA8FF;--blueBg:#1B2E55;--red:#FF8F86;--redBg:#3E1D22;--green:#6FDDA8;--greenBg:#153A2C;--amber:#F5C26B;--amberBg:#3B2F14;--sh:0 10px 34px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);--onblue:#0E1626;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--z));height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 420px at 90% -5%,color-mix(in srgb,#C9962B 18%,transparent),transparent),radial-gradient(900px 520px at 6% -8%,color-mix(in srgb,var(--blue) 24%,transparent),transparent),var(--bg);transform:translateZ(0)}
#app{max-width:520px;margin:0 auto;padding:1rem 1rem 7rem}
[data-layout=tablet] #app{max-width:980px;padding:1.5rem 2rem 7.5rem}
h1{font-size:1.7rem;line-height:1.15;margin:.2rem 0 .3rem;font-weight:800}
h2{font-size:1.15rem;margin:1.4rem 0 .6rem;font-weight:800}
p{margin:.3rem 0}.mute{color:var(--mute);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid color-mix(in srgb,#fff 45%,var(--line));border-radius:20px;padding:1rem;margin:.7rem 0;box-shadow:var(--sh)}
.box{border-radius:12px;padding:.75rem .9rem;margin:.8rem 0;border-left:5px solid}
.box b{display:block;font-size:.8rem;margin-bottom:.15rem}
.merk{background:var(--blueBg);border-color:var(--blue)}.merk b{color:var(--blue)}
.falle{background:var(--redBg);border-color:var(--red)}.falle b{color:var(--red)}
.amber{background:var(--amberBg);border-color:var(--amber)}.amber b{color:var(--amber)}
.btn{display:block;width:100%;min-height:50px;padding:.65rem 1rem;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-align:left;box-shadow:0 2px 12px rgba(20,35,70,.07);transition:transform .15s,box-shadow .2s,background .2s}
.btn:active,.chip:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--blue),color-mix(in srgb,var(--blue) 70%,#7c5cff));border:0;color:var(--onblue);text-align:center;font-weight:800;box-shadow:0 8px 22px color-mix(in srgb,var(--blue) 38%,transparent)}
.btn.sm{display:inline-block;width:auto;min-height:38px;padding:.35rem .9rem;border-radius:12px;font-size:.88rem;text-align:center;box-shadow:none}
.btn.danger{background:var(--redBg);border-color:var(--red);color:var(--red);text-align:center;font-weight:800}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1 1 140px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}.btns .btn{text-align:center;min-height:46px;padding:.5rem .6rem}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;margin:.4rem 0}
.chip{min-height:42px;padding:.4rem .9rem;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.9rem;box-shadow:0 1px 6px rgba(20,35,70,.06);transition:transform .15s,background .2s}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--onblue);box-shadow:0 4px 14px color-mix(in srgb,var(--blue) 35%,transparent)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:.5rem 0 1rem}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.opts{display:grid;gap:.6rem;margin-top:1rem}
[data-layout=tablet] .opts{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:.7rem;align-items:flex-start;min-height:56px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blueBg);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.opt.ok{background:var(--greenBg);border-color:var(--green);animation:pop .4s}.opt.ok .l{background:var(--green);color:#fff}
.opt.no{background:var(--redBg);border-color:var(--red);animation:shk .35s}.opt.no .l{background:var(--red);color:#fff}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-size:1.25rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.tag{font-size:.8rem;color:var(--blue);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.stats div{background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid color-mix(in srgb,#fff 45%,var(--line));border-radius:18px;padding:.7rem;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font-size:1.5rem;font-weight:800}
.term{cursor:pointer}.term h3{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;gap:.5rem}
.term .d{display:none;margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--line)}.term.open .d{display:block}
.term.k{border-left:5px solid var(--green)}.term.n{border-left:5px solid var(--red)}
[data-layout=tablet] .grid{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .8rem;align-items:start}
input[type=search],input[type=email],input[type=password],input[type=date],input:not([type]),select,textarea{width:100%;padding:.7rem .9rem;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:48px}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:.8rem}
textarea.vin{font-family:inherit;font-size:1.05rem;min-height:120px;resize:vertical}
input[type=email],input[type=password],input:not([type]){margin-top:.6rem}
nav{position:fixed;left:.6rem;right:.6rem;bottom:calc(.6rem + env(safe-area-inset-bottom,0));max-width:640px;margin:0 auto;display:flex;gap:2px;padding:.3rem;z-index:5;border-radius:26px;background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid color-mix(in srgb,#fff 40%,var(--line));box-shadow:var(--sh)}

function guideModal(){const n=ui.guide,g=GUIDE[n],last=n===GUIDE.length-1;
 return`<div class="gmodal" data-a="gclose"><div class="gbox" data-a="keep" role="dialog" aria-modal="true" aria-label="Anleitung: Konto erstellen"><div class="ghead"><h2>Konto erstellen · Schritt ${n+1} von ${GUIDE.length}</h2><button class="gx" data-a="gclose" aria-label="Schließen">✕</button></div>
 <div class="gdots">${GUIDE.map((_,i)=>`<i class="${i===n?"on":""}"></i>`).join("")}</div>
 <div class="gslide" key="${n}"><div class="gimg"><img src="${g.i}" alt="Screenshot zu Schritt ${n+1}">${g.h.map(([x,y,w,h,l,d])=>`<span class="hl ${d?"dn":""}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><em>${E(l)}</em></span>`).join("")}</div>
 <p class="gtxt">${E(g.t)}<small>${E(g.n)}</small></p></div>
 <div class="gnav"><button class="btn" data-a="gprev" ${n?"":"disabled"}>Zurück</button><button class="btn pri" data-a="${last?"gclose":"gnext"}">${last?"Fertig":"Weiter"}</button></div></div></div>`}

/* ===== Globale Klausurtermine ===== */
const GXK="studiq-gexams";let GX=[];try{GX=JSON.parse(localStorage.getItem(GXK))||[]}catch(e){}if(!Array.isArray(GX))GX=[];
async function loadGlobalExams(){const t=await tok();if(!t)return;
 const j=await sbj("/rest/v1/global_exams?select=id,subject,title,exam_date&order=exam_date.asc",{headers:H(t)});if(!Array.isArray(j))return;
 GX=j.map(r=>({id:r.id,f:r.subject,d:r.exam_date,t:r.title||"",g:1}));const old=GX.filter(gxExp);GX=GX.filter(x=>!gxExp(x));try{localStorage.setItem(GXK,JSON.stringify(GX))}catch(e){}
 /* Abgelaufene Termine (ab 12 Uhr am Prüfungstag) in der Datenbank entfernen; zuerst per Funktion, als Admin zur Not direkt */
 if(old.length)tapi("/rest/v1/rpc/purge_expired_global_exams",{method:"POST",body:"{}"}).catch(()=>{if(isAdmin())return tapi("/rest/v1/global_exams?id=in.("+old.map(x=>x.id).join(",")+")",{method:"DELETE"}).catch(()=>{})})}
const gxExp=x=>{const t=ld(Date.now());return x.d<t||(x.d===t&&new Date().getHours()>=12)};
const gxl=()=>GX.filter(x=>!gxExp(x));
const allX=()=>[...gxl(),...(st.exd||[])];
const gxerr=e=>e.st===404?"Tabelle global_exams nicht gefunden. Bitte supabase_global_exams.sql im Supabase SQL Editor ausführen.":(e.st===401||e.st===403)?"Keine Berechtigung. Ist das Admin-Konto in app_admins eingetragen?":(e.message||"Unbekannter Fehler");
function gAddX(d,f,t){const b={subject:f,title:t,exam_date:d};
 tapi("/rest/v1/global_exams",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)}).then(()=>loadGlobalExams()).then(()=>{ui.msg="Globaler Termin gespeichert. Er erscheint bei allen Nutzern.";ui.dmsg=ui.msg}).catch(e=>{ui.msg="Fehler: "+gxerr(e)}).then(()=>{ui.det.exd=true;render()})}
function gDelX(id){if(ui.gxd!==id){ui.gxd=id;ui.det.exd=true;render();return}ui.gxd="";
 tapi("/rest/v1/global_exams?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=representation"}}).then(r=>{if(!r||!r.length){const er=new Error("");er.st=403;throw er}return loadGlobalExams()}).then(()=>{ui.msg="Termin gelöscht."}).catch(e=>{ui.msg="Fehler: "+gxerr(e)}).then(()=>{ui.det.exd=true;render()})}

/* Muss synchron im Klick laufen: Seite als Medien-Wiedergabe markieren, damit der Stumm-Schalter die Ausgabe nicht blockiert */
const HASAS=()=>{try{return!!navigator.audioSession}catch(e){return false}};
/* Verhindert (soweit möglich) Sperrbildschirm-/Statusleisten-Player */
const noMedia=()=>{try{const m=navigator.mediaSession;if(m){m.metadata=null;m.playbackState="none";for(const a of["play","pause","stop","seekbackward","seekforward","previoustrack","nexttrack","seekto"])try{m.setActionHandler(a,null)}catch(e){}}}catch(e){}};

 try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
 try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!_ac)_ac=new AC();if(_ac.state!=="running")_ac.resume();const b=_ac.createBufferSource();b.buffer=_ac.createBuffer(1,1,22050);b.connect(_ac.destination);b.start(0)}}catch(e){}
 /* Stiller <audio>-Loop nur noch auf altem iOS ohne audioSession (er erzeugt den Sperrbildschirm-Player) */
 if(!IOS||HASAS())return;
 try{if(!_sil){_sil=new Audio(silentURL());_sil.loop=true;_sil.setAttribute("playsinline","")}
  const p=_sil.play();if(p&&p.catch)p.catch(()=>{});clearTimeout(_silT);_silT=setTimeout(stopSil,20000);noMedia()}catch(e){}}
function stopSil(){clearTimeout(_silT);try{_sil&&_sil.pause()}catch(e){}}
function gtts(txt,g,fb){const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+g+"&q="+encodeURIComponent(txt.slice(0,200)));
 a.referrerPolicy="no-referrer";try{a.disableRemotePlayback=true}catch(e){}ttsA=a;let done=0;const bad=()=>{if(done)return;done=1;if(fb)fb();else{stopSil();toast("Aussprache ist auf diesem Gerät gerade nicht verfügbar.")}};

 u.onerror=ev=>{ok=1;if(ev.error!=="canceled"&&ev.error!=="interrupted")gtts(txt,L.g);else stopSil()};speechSynthesis.speak(u);
 /* Wächter gegen stille Aussetzer (iOS/Chrome verschlucken manchmal die Äußerung) */
 setTimeout(()=>{try{if(!ok&&!speechSynthesis.speaking){speechSynthesis.cancel();gtts(txt,L.g)}}catch(e){}},1600);return true}catch(e){return false}}
function say(txt){const L=TTSL[st.set.fach];txt=String(txt||"").replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();if(!L||!txt)return;

 const v=pickVoice(L.g,L.pref),go=()=>{if(v&&nat(txt,L,v))return;gtts(txt,L.g)};
 /* Alt-iOS ohne audioSession: <audio> ignoriert den Stumm-Schalter, Systemstimme nur als Rückfall */
 if(IOS&&!HASAS()){gtts(txt,L.g,v?()=>{nat(txt,L,v)||gtts(txt,L.g)}:null);return}
 if(busy)setTimeout(go,80);else go()}

let pubS="";
async function pubStats(force){if(!au)return;const t=await tok();if(!t)return;
 const h=Math.floor(Date.now()/36e5),xl={};for(const[k,v]of Object.entries(st.xlog||{}))if(+k>=h-48)xl[k]=v;
 const dk=DK.find(x=>x.id===st.set.deckel),b={user_id:au.id,nick:String(st.set.nick||"Lernender").slice(0,20),xp:st.xp||0,streak:streak(),last_day:[...st.days].sort().pop()||null,xlog:xl,deckel:dk&&dkOpen(dk)?dk.id:"standard"},j=JSON.stringify(b);
 if(!force&&j===pubS)return;
 await sbj("/rest/v1/profile_stats?on_conflict=user_id",{method:"POST",headers:{...H(t),Prefer:"resolution=merge-duplicates,return=minimal"},body:j});pubS=j}
async function tapi(p,o){const t=await tok();if(!t)throw new Error("Nicht angemeldet.");return sbj(p,{...o,headers:{...H(t),...(o&&o.headers||{})}})}
async function loadTeams(){try{const m=await tapi("/rest/v1/team_members?select=team_id"),c={};for(const r of m||[])c[r.team_id]=(c[r.team_id]||0)+1;ui.tcnt=c}catch(e){}
 ui.teams=(await tapi("/rest/v1/teams?select=id,name,code,created_by,created_at&order=created_at.asc"))||[];
 if(!ui.teams.some(x=>x.id===st.set.team)){st.set.team=ui.teams[0]?ui.teams[0].id:"";persist()}}
async function loadBoard(){if(!st.set.team){ui.board=null;return}const id=st.set.team,r=await tapi("/rest/v1/rpc/team_board",{method:"POST",body:JSON.stringify({p_team:id})});if(id===st.set.team)ui.board=r||[]}
async function refreshTeams(){if(!au||ui.tbusy)return;ui.tbusy=1;ui.terr="";
 try{try{await pubStats(true)}catch(e){}await loadTeams();if(ui.topen&&!(ui.teams||[]).some(x=>x.id===ui.topen))ui.topen=null;if(ui.topen){st.set.team=ui.topen;await loadBoard()}}catch(e){ui.terr=terr(e)}
 ui.tbusy=0;softRender()}
function copyTxt(t){try{if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t)}catch(e){}

const ldY=()=>ld(Date.now()-864e5);
function eff(r){const h=Math.floor(Date.now()/36e5);let x24=0;for(const[k,v]of Object.entries(r.xlog||{}))if(+k>h-24)x24+=v;
 return{...r,sk:r.last_day&&r.last_day>=ldY()?r.streak:0,x24}}
const MED=["gold","silber","bronze"];
function weekCard(){const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-dow);
 const N=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"],S=["Mo","Di","Mi","Do","Fr","Sa","So"],today=ld(now),
 days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const k=ld(d);return{k,i,xp:(st.dh||{})[k]||0,fut:k>today,today:k===today}}),
 mx=Math.max(60,...days.map(x=>x.xp)),tot=days.reduce((a,x)=>a+x.xp,0),sel=days.find(x=>x.k===ui.wk)||days.find(x=>x.today);
 return`<div class="card grp wk7"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="margin:0">Diese Woche</h3><span class="mute"><b>${tot}</b> XP</span></div><div class="wbars">${days.map(x=>`<button type="button" class="wcol ${x.today?"today":""} ${x.fut?"fut":""} ${sel&&sel.k===x.k?"sel":""} ${x.xp===0?"z":x.xp<=50?"lo":"hi"}" data-a="wday" data-v="${x.k}" title="${N[x.i]}: ${x.xp} XP" aria-label="${N[x.i]}: ${x.xp} XP${x.today?" (heute)":""}"><span class="wbar"><i style="height:${x.xp?Math.max(10,Math.round(100*x.xp/mx)):0}%"></i></span><b>${S[x.i]}</b>${x.today?"<small>Heute</small>":"<small>&nbsp;</small>"}</button>`).join("")}</div><p class="wdet">${sel?N[sel.i]+": <b>"+sel.xp+" XP</b>":""}</p></div>`}
function boardRows(){const k=ui.tsort==="xp"?"xp":"sk",o=k==="xp"?"sk":"xp";

  if(l[0]==="|"){const rows=[];while(i<L.length&&L[i].trim()[0]==="|"){rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));i++}

  const p=[l];i++;while(i<L.length&&L[i].trim()&&!special.test(L[i].trim())){p.push(L[i].trim());i++}out.push({p:p.join(" ")})}
